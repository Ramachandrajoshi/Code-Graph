name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch; a push mid-CI makes the older run
# irrelevant and these matrices are not cheap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is first-class, not an afterthought: path separators and CRLF
        # byte offsets are exactly the kind of thing that breaks silently on one
        # platform while every test passes on another.
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 22.13 is the floor — the first release where node:sqlite is unflagged.
        node: ['22.13', '22', '24']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  grammars:
    name: grammar ABI compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      # Loads every grammar against the pinned runtime. This is the gate on
      # bumping web-tree-sitter or tree-sitter-wasms: an incompatible pair fails
      # by throwing an Error with an EMPTY message from inside the wasm loader,
      # which looks like a bug in this code rather than a version mismatch.
      - name: Load every grammar
        run: node --test test/grammars.test.js

  benchmark:
    name: response-size benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      # Regression guard on response sizes: if a change makes map or graph
      # chattier, these numbers move and someone notices. It reports no savings
      # multiplier — see the note at the top of bench/run.js.
      - name: Benchmark
        run: npm run bench

  package:
    name: package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      # Catches the classic publish mistake: a `files` entry that silently omits
      # the query files or the grammar manifest, producing a package that
      # installs cleanly and then extracts nothing.
      - name: Verify published files
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map(f => f.path);
            const required = [
              'bin/cgraph.js',
              'src/index.js',
              'src/sdk/index.js',
              'src/core/grammar-manifest.json',
              'src/packs/typescript/queries/tags.scm',
              'src/packs/python/queries/tags.scm',
              'src/packs/go/queries/tags.scm',
              'src/packs/rust/queries/tags.scm',
              'src/packs/java/queries/tags.scm',
              'src/packs/javascript/queries/tags.scm',
              'LICENSE',
              'README.md',
            ];
            const missing = required.filter(r => !files.includes(r));
            if (missing.length) {
              console.error('Missing from published package:\n  ' + missing.join('\n  '));
              process.exit(1);
            }
            console.log('All ' + required.length + ' required files present (' + files.length + ' total).');
          "
